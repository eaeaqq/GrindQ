<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>笔试题练习记录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">题</div>
          <div>
            <h1>笔试题练习记录</h1>
            <p>本地题库和做题轨迹</p>
          </div>
        </div>

        <nav class="nav" aria-label="主要功能">
          <button class="nav-item active" data-view="practice">练习</button>
          <button class="nav-item" data-view="library">题库</button>
          <button class="nav-item" data-view="review">错题</button>
          <button class="nav-item" data-view="history">记录</button>
          <button class="nav-item" data-view="import">导入</button>
        </nav>

        <div class="summary-box">
          <span>今日已做</span>
          <strong id="todayCount">0</strong>
        </div>
      </aside>

      <main class="workspace">
        <section class="topbar">
          <div>
            <p class="eyebrow">Question Bank</p>
            <h2 id="viewTitle">练习</h2>
          </div>
          <div class="actions">
            <button class="icon-btn" id="exportBtn" title="导出备份" aria-label="导出备份">↓</button>
            <label class="icon-btn file-trigger" title="导入备份" aria-label="导入备份">
              ↑
              <input id="backupInput" type="file" accept="application/json" />
            </label>
          </div>
        </section>

        <section class="stats-grid" aria-label="统计">
          <div class="stat-card">
            <span>题目</span>
            <strong id="statQuestions">0</strong>
          </div>
          <div class="stat-card">
            <span>正确率</span>
            <strong id="statAccuracy">0%</strong>
          </div>
          <div class="stat-card">
            <span>错题</span>
            <strong id="statWrong">0</strong>
          </div>
          <div class="stat-card">
            <span>收藏</span>
            <strong id="statStarred">0</strong>
          </div>
        </section>

        <section class="view active" id="practiceView">
          <div class="panel practice-panel">
            <div class="practice-controls">
              <select id="bankFilter" aria-label="选择题库"></select>
              <select id="practiceMode" aria-label="练习模式">
                <option value="all">全部题目</option>
                <option value="wrong">只练错题</option>
                <option value="starred">只练收藏</option>
              </select>
              <button id="prevBtn" class="ghost-btn">上一题</button>
              <button id="nextBtn">下一题</button>
            </div>

            <div id="emptyPractice" class="empty-state">
              还没有题目。先去“导入”粘贴一批题，或者在“题库”手动添加。
            </div>

            <article class="question-card hidden" id="questionCard">
              <div class="question-meta">
                <span id="questionBank"></span>
                <span id="questionType"></span>
                <span id="questionSource"></span>
                <button class="ghost-btn" id="starBtn">收藏</button>
                <button class="ghost-btn" id="quickEditAnswerBtn">改答案解析</button>
              </div>
              <h3 id="questionText"></h3>
              <div id="optionList" class="option-list"></div>
              <div class="answer-row">
                <button id="submitBtn">提交答案</button>
                <button class="ghost-btn" id="revealBtn">看答案</button>
              </div>
              <div class="result-box hidden" id="resultBox"></div>
            </article>
          </div>
        </section>

        <section class="view" id="libraryView">
          <div class="panel">
            <div class="section-head">
              <h3>题库</h3>
              <button id="addQuestionBtn">新增题目</button>
            </div>
            <div class="filters">
              <input id="searchInput" type="search" placeholder="搜索题干、选项、标签" />
              <select id="libraryBankFilter" aria-label="题库筛选"></select>
              <button class="danger-btn" id="deleteBankBtn">删除选中题库</button>
            </div>
            <div id="bankDeleteList" class="bank-delete-list" aria-label="选择要删除的题库"></div>
            <div id="questionList" class="question-list"></div>
          </div>
        </section>

        <section class="view" id="reviewView">
          <div class="panel">
            <div class="section-head">
              <h3>错题和收藏</h3>
              <button id="practiceWrongBtn">开始错题练习</button>
            </div>
            <div id="reviewList" class="question-list"></div>
          </div>
        </section>

        <section class="view" id="historyView">
          <div class="panel">
            <div class="section-head">
              <h3>做题记录</h3>
              <button class="danger-btn" id="clearHistoryBtn">清空记录</button>
            </div>
            <div id="historyList" class="history-list"></div>
          </div>
        </section>

        <section class="view" id="importView">
          <div class="panel import-grid">
            <div>
              <h3>批量导入</h3>
              <p class="muted">支持常见选择题格式：题号开头，选项以 A/B/C/D 开头，答案行写“答案：B”或“参考答案：AC”。没有答案也能保存，之后做题时可补。</p>
              <input id="importBank" type="text" value="华为数字芯片" aria-label="导入题库名称" />
              <textarea id="importText" spellcheck="false" placeholder="1. 这里是题干
A. 选项一
B. 选项二
C. 选项三
D. 选项四
答案：B"></textarea>
              <div class="answer-row">
              <button id="parseBtn">解析预览</button>
              <button id="saveImportBtn">保存导入</button>
            </div>
              <div class="excel-import">
                <label class="file-wide">
                  导入 Excel 题库
                  <input id="excelInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                </label>
                <p class="muted">Excel 表头支持：题库、题型、题干、A-H、答案、解析、标签。可直接导入转换脚本生成的表。</p>
              </div>
            </div>
            <div>
              <h3>预览</h3>
              <div id="importPreview" class="preview-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="questionDialog">
      <form method="dialog" class="dialog-form">
        <h3 id="dialogTitle">新增题目</h3>
        <label>题库<input id="formBank" type="text" required /></label>
        <label>标签<input id="formTags" type="text" placeholder="Verilog, STA" /></label>
        <label>题型
          <select id="formType">
            <option value="single">单选</option>
            <option value="multiple">多选</option>
            <option value="text">简答</option>
          </select>
        </label>
        <label>题干<textarea id="formText" required></textarea></label>
        <label>选项<textarea id="formOptions" placeholder="A. 选项一&#10;B. 选项二"></textarea></label>
        <label>答案<input id="formAnswer" type="text" placeholder="B 或 AC" /></label>
        <label>解析<textarea id="formExplain"></textarea></label>
        <menu>
          <button id="cancelQuestionBtn" type="button" class="ghost-btn">取消</button>
          <button id="saveQuestionBtn" type="submit" value="default">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="answerDialog">
      <form method="dialog" class="dialog-form">
        <h3>修改答案和解析</h3>
        <label>答案<input id="quickAnswer" type="text" placeholder="B 或 AC" /></label>
        <label>解析<textarea id="quickExplain"></textarea></label>
        <menu>
          <button id="cancelAnswerBtn" type="button" class="ghost-btn">取消</button>
          <button id="saveAnswerBtn" type="submit">保存</button>
        </menu>
      </form>
    </dialog>

    <script src="./app.js?v=20260819"></script>
  </body>
</html>
